<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322d3ee' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20'/><path d='M2 12h20'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Powered Smart City Traffic & Emergency Response System</title>
    <meta name="description" content="Intelligent traffic monitoring, dynamic signal management, and emergency vehicle priority using AI and IoT." />
    <script>
      // Initialize theme from localStorage, default to 'dark'
      const savedTheme = localStorage.getItem('smartcity_theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="bg-[#0B1120] text-[#F8FAFC] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
